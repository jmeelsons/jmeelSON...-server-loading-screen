<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>huy loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bahnschrift', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      margin: 0;
      overflow: hidden;
    }

    .bg-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0d0f;
      z-index: 0;
      pointer-events: none;
    }

    .bg-lines canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .server-name {
      font-weight: 800;
      font-size: 12rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      text-shadow: 0 0 60px rgba(155, 0, 0, 0.4), 0 2px 20px rgba(0, 0, 0, 0.7);
      font-family: inherit;
      text-align: center;
      line-height: 1;
    }

    .server-name .red {
      color: rgba(220, 60, 60, 0.95);
    }

    .server-name .white {
      color: #ffffff;
    }

    .changing-messages {
      position: relative;
      height: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      padding: 0 1rem;
      margin-top: 0.2rem;
    }

    .message {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      color: #b0b0b8;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      font-weight: 300;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(200, 60, 60, 0.15);
      white-space: nowrap;
    }

    .message.active {
      opacity: 1;
      transform: translateY(0);
    }

    .message-line {
      width: 120px;
      height: 1px;
      margin-top: 0.6rem;
      background: linear-gradient(90deg, transparent, rgba(200, 60, 60, 0.4), transparent);
      opacity: 0.5;
    }

    .bottom-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin-top: 1.4rem;
    }

    .bottom-dots .bdot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #cc3333;
      opacity: 0.25;
      transform: scale(0.7);
      animation: bdotPulse 1.2s ease-in-out infinite;
    }

    .bottom-dots .bdot:nth-child(1) { animation-delay: 0s; }
    .bottom-dots .bdot:nth-child(2) { animation-delay: 0.2s; }
    .bottom-dots .bdot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bdotPulse {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.7);
        box-shadow: 0 0 3px rgba(200, 50, 50, 0.1);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
        box-shadow: 0 0 14px rgba(220, 60, 60, 0.6);
      }
    }

    @media (max-width: 1280px) {
      .server-name {
        font-size: 9rem;
      }
    }

    @media (max-width: 1024px) {
      .server-name {
        font-size: 7rem;
      }
    }

    @media (max-width: 768px) {
      .server-name {
        font-size: 5rem;
      }
    }

    @media (max-width: 480px) {
      .server-name {
        font-size: 3.2rem;
        margin-bottom: 0.6rem;
      }
      .changing-messages {
        height: 2rem;
      }
      .message {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
      }
      .bottom-dots .bdot {
        width: 6px;
        height: 6px;
      }
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
  </style>
</head>
<body>
  <div class="bg-lines">
    <canvas id="bgCanvas"></canvas>
  </div>

  <div class="content">
    <div class="server-name">
      <span class="red">J</span><span class="white">-CITY</span>
    </div>

    <div class="changing-messages" id="changingMessages">
      <span class="message active">Look behind you.</span>
      <span class="message">haii everione ^w^</span>
      <span class="message">Be quiet.</span>
      <span class="message">it's this? old SNB?</span>
      <span class="message">Welcome to guys)</span>
      <span class="message">Some try, Renchdedsex Server</span>
      <span class="message">Nikita Zuev, hi.</span>
      <span class="message">Nice music huh? (in my mind)</span>
    </div>
    <div class="message-line"></div>

    <div class="bottom-dots">
      <div class="bdot"></div>
      <div class="bdot"></div>
      <div class="bdot"></div>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');

      let W, H;
      const xbars = 17; 
      const ybars = 30;  
      let animTime = 0;
      const speed = 30; 

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function draw() {
        animTime += 0.016;

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0d0d0f';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(155, 0, 0, 0.08)';
        ctx.lineWidth = 1;

        for (let i = 1; i <= xbars + 1; i++) {
          let yPos = (H / xbars) * (i - 1) + (animTime * speed % (H / xbars));
          ctx.beginPath();
          ctx.moveTo(0, yPos);
          ctx.lineTo(W, yPos);
          ctx.stroke();
        }

        for (let i = 1; i <= ybars + 1; i++) {
          let xPos = (W / ybars) * i - (animTime * speed % (W / ybars));
          ctx.beginPath();
          ctx.moveTo(xPos, 0);
          ctx.lineTo(xPos, H);
          ctx.stroke();
        }

        const gradL = ctx.createLinearGradient(0, 0, 30, 0);
        gradL.addColorStop(0, 'rgba(80, 0, 0, 0.5)');
        gradL.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradL;
        ctx.fillRect(0, 0, 30, H);

        const gradR = ctx.createLinearGradient(W, 0, W - 30, 0);
        gradR.addColorStop(0, 'rgba(80, 0, 0, 0.5)');
        gradR.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradR;
        ctx.fillRect(W - 30, 0, 30, H);

        const gradU = ctx.createLinearGradient(0, 0, 0, 30);
        gradU.addColorStop(0, 'rgba(80, 0, 0, 0.5)');
        gradU.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradU;
        ctx.fillRect(0, 0, W, 30);

        const gradD = ctx.createLinearGradient(0, H, 0, H - 30);
        gradD.addColorStop(0, 'rgba(80, 0, 0, 0.5)');
        gradD.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradD;
        ctx.fillRect(0, H - 30, W, 30);

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();

      const messages = document.querySelectorAll('.message');
      let currentIndex = 0;
      const totalMessages = messages.length;
      const interval = 6001;

      function nextMessage() {
        messages[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % totalMessages;
        messages[currentIndex].classList.add('active');
      }

      setInterval(nextMessage, interval);
    })();
  </script>
</body>
</html>
