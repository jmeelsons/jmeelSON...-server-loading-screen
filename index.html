<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>huy loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bahnschrift', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      margin: 0;
      overflow: hidden;
    }

    .bg-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0d0f;
      z-index: 0;
      pointer-events: none;
    }

    .bg-lines canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .server-name {
      color: rgba(220, 60, 60, 0.95);
      font-weight: 300;
      font-size: 2.2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      text-shadow: 0 0 30px rgba(155, 0, 0, 0.3), 0 2px 12px rgba(0, 0, 0, 0.5);
      font-family: inherit;
      text-align: center;
      line-height: 1.2;
    }

    .spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      opacity: 0.3;
      transform: scale(0.8);
      animation: pulse 1.6s ease-in-out infinite alternate;
      box-shadow: 0 0 6px rgba(180, 50, 50, 0.1);
    }

    .dot:nth-child(1) { animation-delay: 0.0s; background: #cc3333; }
    .dot:nth-child(2) { animation-delay: 0.3s; background: #dd4444; }
    .dot:nth-child(3) { animation-delay: 0.6s; background: #ee5555; }
    .dot:nth-child(4) { animation-delay: 0.9s; background: #ff6666; }

    @keyframes pulse {
      0% {
        opacity: 0.2;
        transform: scale(0.75);
        box-shadow: 0 0 4px rgba(200, 50, 50, 0.05);
      }
      100% {
        opacity: 1;
        transform: scale(1.1);
        box-shadow: 0 0 24px rgba(200, 50, 50, 0.4);
      }
    }

    @media (max-width: 480px) {
      .server-name {
        font-size: 1.6rem;
        margin-bottom: 1.5rem;
      }
      .dot {
        width: 13px;
        height: 13px;
        gap: 0.6rem;
      }
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
  </style>
</head>
<body>
  <div class="bg-lines">
    <canvas id="bgCanvas"></canvas>
  </div>

  <div class="content">
    <div class="server-name">BUTTHOLE Z-CITY SERVER</div>
    <div class="spinner">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');

      let W, H;
      const xbars = 17; 
      const ybars = 30;  
      let animTime = 0;
      const speed = 30; 

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function draw() {
        animTime += 0.016; // ~

        ctx.clearRect(0, 0, W, H);

        ctx.fillStyle = '#0d0d0f';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(155, 0, 0, 0.08)';
        ctx.lineWidth = 1;

        const spacingX = H / xbars;
        for (let i = 1; i <= xbars + 1; i++) {
          let yPos = (H / xbars) * (i - 1) + (animTime * speed % (H / xbars));
          ctx.beginPath();
          ctx.moveTo(0, yPos);
          ctx.lineTo(W, yPos);
          ctx.stroke();
        }

        const spacingY = W / ybars;
        for (let i = 1; i <= ybars + 1; i++) {
          let xPos = (W / ybars) * i - (animTime * speed % (W / ybars));
          ctx.beginPath();
          ctx.moveTo(xPos, 0);
          ctx.lineTo(xPos, H);
          ctx.stroke();
        }

        const gradL = ctx.createLinearGradient(0, 0, 30, 0);
        gradL.addColorStop(0, 'rgba(80, 0, 0, 0.5)');
        gradL.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradL;
        ctx.fillRect(0, 0, 30, H);

        const gradR = ctx.createLinearGradient(W, 0, W - 30, 0);
        gradR.addColorStop(0, 'rgba(80, 0, 0, 0.5)');
        gradR.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradR;
        ctx.fillRect(W - 30, 0, 30, H);

        const gradU = ctx.createLinearGradient(0, 0, 0, 30);
        gradU.addColorStop(0, 'rgba(80, 0, 0, 0.5)');
        gradU.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradU;
        ctx.fillRect(0, 0, W, 30);

        const gradD = ctx.createLinearGradient(0, H, 0, H - 30);
        gradD.addColorStop(0, 'rgba(80, 0, 0, 0.5)');
        gradD.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradD;
        ctx.fillRect(0, H - 30, W, 30);

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();
    })();
  </script>
</body>
</html>
