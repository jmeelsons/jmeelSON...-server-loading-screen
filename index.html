<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>J-CITY loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0f;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      font-family: 'Bahnschrift', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      margin: 0;
      overflow: hidden;
    }

    .bg-slideshow {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0; overflow: hidden;
      background: #0d0d0f;
      pointer-events: none;
    }
    .bg-slide {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.12);
      transition: opacity 1.6s ease;
      will-change: opacity, transform;
    }
    .bg-slide.active {
      opacity: 1;
      animation: kenburns 9s ease-out forwards;
    }
    @keyframes kenburns {
      0%   { transform: scale(1.12) translate(0, 0); }
      100% { transform: scale(1.22) translate(-1.5%, -1%); }
    }
    .bg-slideshow::after {
      content: '';
      position: absolute; inset: 0;
      background:
        linear-gradient(to top, rgba(5,5,7,0.92) 0%, rgba(5,5,7,0.25) 45%, rgba(5,5,7,0.45) 100%),
        radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
    }

    .falling-emojis {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1; pointer-events: none; overflow: hidden;
    }
    .falling-emojis img {
      position: absolute; top: -80px;
      user-select: none; will-change: transform;
      animation: fall linear infinite;
      filter: blur(0.2px); opacity: 0.45;
      image-rendering: auto;
    }
    @keyframes fall {
      0%   { transform: translateY(-80px) rotate(0deg) scale(1); opacity: 0.55; }
      70%  { opacity: 0.42; }
      100% { transform: translateY(calc(100vh + 140px)) rotate(360deg) scale(1.15); opacity: 0.12; }
    }

    .now-playing {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.45rem 1.1rem 0.45rem 0.85rem;
      background: rgba(20, 10, 12, 0.55);
      border: 1px solid rgba(200, 60, 60, 0.25);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45), 0 0 18px rgba(200, 60, 60, 0.12);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #d8d8de;
      font-weight: 300;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .now-playing.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .now-playing .np-icon {
      display: inline-block;
      width: 0.62rem;
      height: 0.62rem;
      border-radius: 50%;
      background: rgba(220, 60, 60, 0.95);
      box-shadow: 0 0 8px rgba(220, 60, 60, 0.8);
      animation: np-pulse 1.6s ease-in-out infinite;
      flex: 0 0 auto;
    }
    @keyframes np-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.82); }
    }
    .now-playing .np-label {
      color: #8a8a92;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
    }
    .now-playing .np-track {
      color: #f0f0f4;
      font-weight: 600;
      letter-spacing: 0.12em;
      max-width: 46vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: flex-end;
      padding: 0 0 2.2rem 2.6rem;
    }

    .server-name {
      font-weight: 800; font-size: 6rem;
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 0.7rem;
      text-shadow: 0 0 60px rgba(155, 0, 0, 0.4), 0 2px 20px rgba(0, 0, 0, 0.7);
      font-family: inherit; text-align: left; line-height: 1;
    }
    .server-name .red   { color: rgba(255, 0, 0, 255); }
    .server-name .white { color: #ffffff; }

    .progress-wrap {
      width: 320px; max-width: 80vw;
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .progress-info {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 0.72rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: #b8b8c0; font-weight: 300;
    }
    .progress-percent {
      color: rgba(220, 60, 60, 0.95);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      min-width: 3.2em; text-align: left;
    }
    .progress-file {
      flex: 1; text-align: right;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #9a9aa2; font-size: 0.66rem; letter-spacing: 0.08em;
    }
    .progress-track {
      position: relative; width: 100%; height: 2px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      position: absolute; top: 0; left: 0;
      height: 100%; width: 0%;
      background: linear-gradient(90deg, rgba(160, 30, 30, 0.9), rgba(220, 60, 60, 1));
      box-shadow: 0 0 10px rgba(220, 60, 60, 0.5);
      border-radius: 2px;
      transition: width 0.35s ease;
    }

    @media (max-width: 1280px) { .server-name { font-size: 4.6rem; } }
    @media (max-width: 1024px) { .server-name { font-size: 3.8rem; } }
    @media (max-width: 768px)  { .server-name { font-size: 3rem; } }
    @media (max-width: 480px)  {
      .content { padding: 0 0 1.4rem 1.2rem; }
      .server-name { font-size: 2.2rem; margin-bottom: 0.5rem; }
      .falling-emojis img { width: 28px; }
      .progress-wrap { width: 240px; }
      .progress-file { font-size: 0.6rem; }
      .now-playing { top: 10px; font-size: 0.62rem; padding: 0.35rem 0.8rem 0.35rem 0.65rem; }
      .now-playing .np-label { font-size: 0.55rem; }
      .now-playing .np-track { max-width: 40vw; }
    }

    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>

  <script src="jquery-3.4.1.min.js"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
</head>
<body>
  <div class="bg-slideshow" id="bgSlideshow"></div>

  <div class="falling-emojis" id="fallingEmojis"></div>

  <div class="now-playing" id="nowPlaying">
    <span class="np-icon"></span>
    <span class="np-label">now playing:</span>
    <span class="np-track" id="npTrack">—</span>
  </div>

  <div class="content">
    <div class="server-name">
      <span class="red">J</span><span class="white">-CITY</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-info">
        <span class="progress-percent" id="progressPercent">0%</span>
        <span class="progress-file" id="progressFile">initializing...</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const progressFill    = document.getElementById('progressFill');
      const progressPercent = document.getElementById('progressPercent');
      const progressFile    = document.getElementById('progressFile');

      let currentProgress = 0;
      let targetProgress  = 0;
      let smoothInterval  = null;

      function smoothProgress() {
        if (smoothInterval) return;
        smoothInterval = setInterval(() => {
          if (Math.abs(currentProgress - targetProgress) < 0.1) {
            currentProgress = targetProgress;
            progressFill.style.width = currentProgress + '%';
            progressPercent.textContent = Math.round(currentProgress) + '%';
            clearInterval(smoothInterval);
            smoothInterval = null;
            return;
          }
          currentProgress += (targetProgress - currentProgress) * 0.15;
          progressFill.style.width = currentProgress + '%';
          progressPercent.textContent = Math.round(currentProgress) + '%';
        }, 30);
      }

      window.setLoad = function(percentage) {
        const p = Math.max(0, Math.min(100, Number(percentage) || 0));
        if (p > targetProgress) {
          targetProgress = p;
          smoothProgress();
        }
      };

      const origDownloadingFile = window.DownloadingFile;
      window.DownloadingFile = function(filename) {
        if (typeof origDownloadingFile === 'function') {
          try { origDownloadingFile(filename); } catch(e) {}
        }
        if (progressFile && filename) {
          progressFile.textContent = filename.length > 34
            ? filename.slice(0, 31) + '...'
            : filename;
        }
      };

      const origSetStatusChanged = window.SetStatusChanged;
      window.SetStatusChanged = function(status) {
        if (typeof origSetStatusChanged === 'function') {
          try { origSetStatusChanged(status); } catch(e) {}
        }
        if (progressFile && status) {
          progressFile.textContent = status;
        }
        if (status === 'Workshop Complete') window.setLoad(80);
        else if (status === 'Client info sent!') window.setLoad(95);
        else if (status === 'Starting Lua...')   window.setLoad(100);
      };

      const origSetFilesTotal = window.SetFilesTotal;
      window.SetFilesTotal = function(total) {
        if (typeof origSetFilesTotal === 'function') {
          try { origSetFilesTotal(total); } catch(e) {}
        }
        window._totalFiles = total;
        if (progressFile) progressFile.textContent = 'files: ' + total;
      };

      const origSetFilesNeeded = window.SetFilesNeeded;
      window.SetFilesNeeded = function(needed) {
        if (typeof origSetFilesNeeded === 'function') {
          try { origSetFilesNeeded(needed); } catch(e) {}
        }
        if (window._totalFiles && window._totalFiles > 0) {
          const p = 100 - Math.round((needed / window._totalFiles) * 100);
          window.setLoad(p);
        }
      };

      const origGameDetails = window.GameDetails;
      window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
        if (typeof origGameDetails === 'function') {
          try { origGameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode); } catch(e) {}
        }
        window.setLoad(1);
        if (progressFile) progressFile.textContent = 'connecting...';
      };

      let fallbackActive = true;
      let fallbackProgress = 0;

      const fallbackCheck = setInterval(() => {
        if (window._totalFiles && window._totalFiles > 0) {
          fallbackActive = false;
          clearInterval(fallbackCheck);
        }
      }, 500);

      const fallbackInterval = setInterval(() => {
        if (!fallbackActive) {
          clearInterval(fallbackInterval);
          return;
        }
        if (fallbackProgress < 85) {
          fallbackProgress += Math.random() * 1.5 + 0.3;
          if (fallbackProgress > 85) fallbackProgress = 85;
          window.setLoad(fallbackProgress);
        }
      }, 400);

      setTimeout(() => {
        if (targetProgress < 1) {
          window.setLoad(1);
          if (progressFile) progressFile.textContent = 'loading...';
        }
      }, 3000);

      const SLIDESHOW_PATH = 'images/';
      const SLIDESHOW_EXT = '.jpg';
      const SLIDESHOW_COUNT = 38;
      const SLIDE_INTERVAL = 7000;

      (function initSlideshow() {
        const container = document.getElementById('bgSlideshow');
        if (!container) return;

        const images = [];
        for (let i = 1; i <= SLIDESHOW_COUNT; i++) {
          images.push(SLIDESHOW_PATH + i + SLIDESHOW_EXT);
        }

        const slides = images.map((src) => {
          const div = document.createElement('div');
          div.className = 'bg-slide';
          div.style.backgroundImage = 'url("' + src + '")';
          container.appendChild(div);
          return div;
        });

        let idx = 0;
        let order = [];

        function shuffled(n) {
          const a = Array.from({length: n}, (_, i) => i);
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        }

        function showFirst() {
          order = shuffled(slides.length);
          idx = 0;
          slides[order[idx]].classList.add('active');
        }

        function nextSlide() {
          const current = slides[order[idx]];
          current.classList.remove('active');
          void current.offsetWidth;
          current.style.animation = 'none';

          idx = (idx + 1) % order.length;
          if (idx === 0) order = shuffled(slides.length);

          const next = slides[order[idx]];
          next.style.animation = '';
          next.classList.add('active');
        }

        if (slides.length === 0) return;

        let loaded = 0;
        images.forEach((src, i) => {
          const im = new Image();
          im.onload = im.onerror = () => {
            loaded++;
            if (loaded === images.length) start();
          };
          im.src = src;
        });

        let started = false;
        function start() {
          if (started) return;
          started = true;
          showFirst();
          setInterval(nextSlide, SLIDE_INTERVAL);
        }

        setTimeout(start, 2000);
      })();

      const MUSIC_FILES = ['track1.mp3','track2.mp3','track3.mp3','track4.mp3','track5.mp3','track6.mp3','track7.mp3','track8.mp3','track9.mp3','track10.mp3','track11.mp3','track12.mp3','track13.mp3','track14.mp3','track15.mp3','track16.mp3','track17.mp3','track18.mp3','track19.mp3','track20.mp3','track21.mp3','track22.mp3','track23.mp3'];
      const MUSIC_PATH = 'music/';
      const TARGET_VOLUME = 0.05;
      const FADE_IN_TIME = 4000;

      const TRACK_NAMES = {
        'track1.mp3':  'Zoom Noir',
        'track2.mp3':  'just leave me to bleed',
        'track3.mp3':  'SR20DET',
        'track4.mp3':  'NEO INDUSTRIAL',
        'track5.mp3':  'Logic',
        'track6.mp3':  'Hatred',
        'track7.mp3':  'shedon\'tluvyou',
        'track8.mp3':  'the last thing she sent me',
        'track9.mp3':  'BIOS - Slowed',
        'track10.mp3': 'Monochrome LCD',
        'track11.mp3': 'ice - Slowed',
        'track12.mp3': 'popipo00',
        'track13.mp3': '2neural',
        'track14.mp3': 'U Weren\'t Here I Really Miss You',
        'track15.mp3': 'genesis',
        'track16.mp3': 'Lagtrain',
        'track17.mp3': '#21',
        'track18.mp3': 'Feelings - Slowed',
        'track19.mp3': 'Mø4.5b',
        'track20.mp3': 'Pulsewidth',
        'track21.mp3': 'Maria...?',
        'track22.mp3': 'zero',
        'track23.mp3': 'still love you'
      };

      let audio = null;
      let currentTrackIndex = 0;
      let fadeInterval = null;
      let musicStarted = false;
      let interactionBound = false;

      const npEl = document.getElementById('nowPlaying');
      const npTrackEl = document.getElementById('npTrack');
      let npHideTimer = null;

      function prettyTrackName(filename) {
        if (TRACK_NAMES[filename]) return TRACK_NAMES[filename];
        const base = filename.replace(/\.[^.]+$/, '');
        const m = base.match(/^([a-zA-Z]+)[-_ ]?(\d+)$/);
        if (m) {
          const word = m[1].charAt(0).toUpperCase() + m[1].slice(1);
          return word + ' ' + m[2];
        }
        return base.charAt(0).toUpperCase() + base.slice(1);
      }

      function showNowPlaying(filename) {
        if (!npEl || !npTrackEl) return;
        npTrackEl.textContent = prettyTrackName(filename);
        npEl.classList.add('visible');
        if (npHideTimer) clearTimeout(npHideTimer);
        npHideTimer = setTimeout(() => {
          npEl.classList.remove('visible');
        }, 4500);
      }

      function createAudio() {
        if (audio) return;
        audio = new Audio();
        audio.loop = false;
        audio.volume = 0;
        audio.preload = 'auto';
        audio.addEventListener('ended', () => nextTrack());
        audio.addEventListener('error', () => { setTimeout(nextTrack, 1000); });
      }

      function fadeTo(targetVolume, duration, callback) {
        if (!audio) return;
        if (fadeInterval) clearInterval(fadeInterval);
        const startVolume = audio.volume;
        const startTime = performance.now();
        const diff = targetVolume - startVolume;
        if (Math.abs(diff) < 0.001) {
          audio.volume = targetVolume;
          if (callback) callback();
          return;
        }
        fadeInterval = setInterval(() => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          audio.volume = Math.max(0, Math.min(1, startVolume + diff * eased));
          if (progress >= 1) {
            clearInterval(fadeInterval);
            fadeInterval = null;
            audio.volume = targetVolume;
            if (callback) callback();
          }
        }, 30);
      }

      function playTrack(index) {
        if (!audio) createAudio();
        currentTrackIndex = ((index % MUSIC_FILES.length) + MUSIC_FILES.length) % MUSIC_FILES.length;
        const filename = MUSIC_FILES[currentTrackIndex];
        audio.src = MUSIC_PATH + filename;
        audio.volume = 0;
        showNowPlaying(filename);
        const p = audio.play();
        if (p !== undefined) {
          p.then(() => {
            musicStarted = true;
            fadeTo(TARGET_VOLUME, FADE_IN_TIME);
          }).catch(() => {
            musicStarted = false;
            bindInteraction();
          });
        } else {
          bindInteraction();
        }
      }

      function nextTrack() { if (audio) playTrack(currentTrackIndex + 1); }

      function tryStartImmediately() {
        if (!audio) createAudio();
        currentTrackIndex = Math.floor(Math.random() * MUSIC_FILES.length);
        const filename = MUSIC_FILES[currentTrackIndex];
        audio.src = MUSIC_PATH + filename;
        showNowPlaying(filename);

        const p = audio.play();
        if (p !== undefined) {
          p.then(() => {
            musicStarted = true;
            fadeTo(TARGET_VOLUME, FADE_IN_TIME);
          }).catch(() => {
            musicStarted = false;
            bindInteraction();
          });
        } else {
          bindInteraction();
        }
      }

      function bindInteraction() {
        if (interactionBound) return;
        interactionBound = true;

        const startOnInteraction = () => {
          if (musicStarted) return;
          if (!audio) createAudio();

          if (!audio.src) {
            currentTrackIndex = Math.floor(Math.random() * MUSIC_FILES.length);
            audio.src = MUSIC_PATH + MUSIC_FILES[currentTrackIndex];
            showNowPlaying(MUSIC_FILES[currentTrackIndex]);
          }

          const p = audio.play();
          if (p !== undefined) {
            p.then(() => {
              musicStarted = true;
              fadeTo(TARGET_VOLUME, FADE_IN_TIME);
            }).catch(() => {});
          }
        };

        ['click', 'touchstart', 'keydown', 'mousemove', 'scroll'].forEach(ev => {
          window.addEventListener(ev, startOnInteraction, { once: true, passive: true });
        });
      }

      tryStartImmediately();

      const emojiContainer = document.getElementById('fallingEmojis');
      const EMOJI_FILES = Array.from({length: 100}, (_, i) => String(i + 1).padStart(3, '0') + '.png');
      const EMOJI_PATH = 'emoji/';
      const MAX_EMOJIS = 24;

      function createEmoji() {
        if (emojiContainer.children.length >= MAX_EMOJIS) return;
        const img = document.createElement('img');
        img.src = EMOJI_PATH + EMOJI_FILES[Math.floor(Math.random() * EMOJI_FILES.length)];
        img.alt = '';
        img.style.left = Math.random() * 100 + 'vw';
        const duration = 8 + Math.random() * 10;
        const delay = Math.random() * 10;
        const size = 22 + Math.random() * 28;
        const blurAmount = 0.2 + Math.random() * 0.5;
        img.style.width = size + 'px';
        img.style.animationDuration = duration + 's';
        img.style.animationDelay = delay + 's';
        img.style.filter = `blur(${blurAmount}px)`;
        img.style.opacity = 0.35 + Math.random() * 0.2;
        emojiContainer.appendChild(img);
        const totalLifetime = (duration + delay) * 1000 + 800;
        setTimeout(() => { if (img.parentNode) img.remove(); }, totalLifetime);
      }
      for (let i = 0; i < 10; i++) createEmoji();
      setInterval(createEmoji, 800);

    })();
  </script>
</body>
</html>
