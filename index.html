<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>huy loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bahnschrift', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      margin: 0;
      overflow: hidden;
    }

    .bg-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0d0f;
      z-index: 0;
      pointer-events: none;
    }

    .bg-lines canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .falling-emojis {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .falling-emojis img {
      position: absolute;
      top: -80px;
      user-select: none;
      will-change: transform;
      animation: fall linear infinite;
      filter: blur(0.4px);
      opacity: 0.22;
      image-rendering: auto;
    }

    @keyframes fall {
      0% {
        transform: translateY(-80px) rotate(0deg) scale(1);
        opacity: 0.28;
      }
      70% {
        opacity: 0.22;
      }
      100% {
        transform: translateY(calc(100vh + 140px)) rotate(360deg) scale(1.15);
        opacity: 0.06;
      }
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .server-name {
      font-weight: 800;
      font-size: 12rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      text-shadow: 0 0 60px rgba(155, 0, 0, 0.4), 0 2px 20px rgba(0, 0, 0, 0.7);
      font-family: inherit;
      text-align: center;
      line-height: 1;
    }

    .server-name .red {
      color: rgba(220, 60, 60, 0.95);
    }

    .server-name .white {
      color: #ffffff;
    }

    .changing-messages {
      position: relative;
      height: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      padding: 0 1rem;
      margin-top: 0.2rem;
    }

    .message {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      color: #b0b0b8;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      font-weight: 300;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(200, 60, 60, 0.15);
      white-space: nowrap;
    }

    .message.active {
      opacity: 1;
      transform: translateY(0);
    }

    .message-line {
      width: 120px;
      height: 1px;
      margin-top: 0.6rem;
      background: linear-gradient(90deg, transparent, rgba(200, 60, 60, 0.4), transparent);
      opacity: 0.5;
    }

    .bottom-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin-top: 1.4rem;
    }

    .bottom-dots .bdot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #cc3333;
      opacity: 0.25;
      transform: scale(0.7);
      animation: bdotPulse 1.2s ease-in-out infinite;
    }

    .bottom-dots .bdot:nth-child(1) { animation-delay: 0s; }
    .bottom-dots .bdot:nth-child(2) { animation-delay: 0.2s; }
    .bottom-dots .bdot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bdotPulse {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.7);
        box-shadow: 0 0 3px rgba(200, 50, 50, 0.1);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
        box-shadow: 0 0 14px rgba(220, 60, 60, 0.6);
      }
    }

    /* Кнопка управления музыкой */
    .music-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(20, 20, 22, 0.7);
      border: 1px solid rgba(200, 60, 60, 0.3);
      color: #cc3333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s ease;
      backdrop-filter: blur(6px);
      font-size: 18px;
      user-select: none;
    }

    .music-toggle:hover {
      background: rgba(40, 20, 20, 0.8);
      border-color: rgba(220, 60, 60, 0.6);
      box-shadow: 0 0 20px rgba(200, 50, 50, 0.4);
    }

    .music-toggle.muted {
      color: #555;
      border-color: rgba(100, 100, 100, 0.3);
    }

    @media (max-width: 1280px) {
      .server-name {
        font-size: 9rem;
      }
    }

    @media (max-width: 1024px) {
      .server-name {
        font-size: 7rem;
      }
    }

    @media (max-width: 768px) {
      .server-name {
        font-size: 5rem;
      }
    }

    @media (max-width: 480px) {
      .server-name {
        font-size: 3.2rem;
        margin-bottom: 0.6rem;
      }
      .changing-messages {
        height: 2rem;
      }
      .message {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
      }
      .bottom-dots .bdot {
        width: 6px;
        height: 6px;
      }
      .falling-emojis img {
        width: 28px;
      }
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
  </style>
</head>
<body>
  <div class="bg-lines">
    <canvas id="bgCanvas"></canvas>
  </div>
  
  <div class="falling-emojis" id="fallingEmojis"></div>

  <div class="content">
    <div class="server-name">
      <span class="red">J</span><span class="white">-CITY</span>
    </div>

    <div class="changing-messages" id="changingMessages">
      <span class="message active">Look behind you.</span>
      <span class="message">haii everione ^w^</span>
      <span class="message">Be quiet.</span>
      <span class="message">it's this? old SNB?</span>
      <span class="message">Welcome to guys)</span>
      <span class="message">Some try, Renchdedsex Server</span>
      <span class="message">Nikita Zuev, hi.</span>
      <span class="message">Nice music huh? (in my mind)</span>
    </div>
    <div class="message-line"></div>

    <div class="bottom-dots">
      <div class="bdot"></div>
      <div class="bdot"></div>
      <div class="bdot"></div>
    </div>
  </div>

  <div class="music-toggle" id="musicToggle" title="Включить/выключить музыку">♪</div>

  <script>
    (function() {
      
      const MUSIC_FILES = [
        'track1.mp3',
        'track2.mp3',
        'track3.mp3',
        'track4.mp3',
        'track5.mp3',
        'track6.mp3'        
      ];

      const MUSIC_PATH = 'music/';
      const TARGET_VOLUME = 0.35;
      const FADE_IN_TIME = 4000;
      const FADE_OUT_TIME = 1500;

      let audio = null;
      let currentTrackIndex = 0;
      let fadeInterval = null;
      let userMuted = false;
      let audioReady = false;

      const toggleBtn = document.getElementById('musicToggle');

      function createAudio() {
        if (audio) return;
        audio = new Audio();
        audio.loop = false;
        audio.volume = 0;
        audio.preload = 'auto';

        audio.addEventListener('ended', () => {
          nextTrack();
        });

        audio.addEventListener('error', () => {
          console.warn('Не удалось загрузить:', audio.src);
          setTimeout(nextTrack, 1000);
        });
      }

      function fadeTo(targetVolume, duration, callback) {
        if (!audio) return;
        if (fadeInterval) clearInterval(fadeInterval);

        const startVolume = audio.volume;
        const startTime = performance.now();
        const diff = targetVolume - startVolume;

        if (Math.abs(diff) < 0.001) {
          audio.volume = targetVolume;
          if (callback) callback();
          return;
        }

        fadeInterval = setInterval(() => {
          const elapsed = performance.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          audio.volume = Math.max(0, Math.min(1, startVolume + diff * eased));

          if (progress >= 1) {
            clearInterval(fadeInterval);
            fadeInterval = null;
            audio.volume = targetVolume;
            if (callback) callback();
          }
        }, 30);
      }

      function playTrack(index) {
        if (!audio) createAudio();
        currentTrackIndex = ((index % MUSIC_FILES.length) + MUSIC_FILES.length) % MUSIC_FILES.length;
        const file = MUSIC_FILES[currentTrackIndex];

        audio.src = MUSIC_PATH + file;
        audio.volume = 0;

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            audioReady = true;
            if (!userMuted) {
              fadeTo(TARGET_VOLUME, FADE_IN_TIME);
              toggleBtn.classList.remove('muted');
            }
          }).catch((err) => {
            audioReady = false;
            console.log('Ожидание взаимодействия пользователя для запуска музыки');
          });
        }
      }

      function nextTrack() {
        if (!audio) return;
        playTrack(currentTrackIndex + 1);
      }

      function toggleMute() {
        if (!audio) {

          playTrack(0);
          userMuted = false;
          return;
        }

        if (userMuted) {
          userMuted = false;
          toggleBtn.classList.remove('muted');
          toggleBtn.textContent = '♪';
          if (audio.paused) {
            audio.play().then(() => {
              fadeTo(TARGET_VOLUME, FADE_IN_TIME);
            }).catch(() => {});
          } else {
            fadeTo(TARGET_VOLUME, 800);
          }
        } else {
          userMuted = true;
          toggleBtn.classList.add('muted');
          toggleBtn.textContent = '✕';
          fadeTo(0, FADE_OUT_TIME);
        }
      }

      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMute();
      });

      function tryAutoplay() {
        if (!audio) {
          createAudio();
          playTrack(0);
        } else if (audio.paused && !userMuted) {
          audio.play().then(() => {
            fadeTo(TARGET_VOLUME, FADE_IN_TIME);
          }).catch(() => {});
        }
      }

      ['click', 'touchstart', 'keydown', 'mousemove', 'scroll'].forEach(ev => {
        window.addEventListener(ev, function onFirstInteract() {
          tryAutoplay();
        }, { passive: true });
      });

      createAudio();
      audio.src = MUSIC_PATH + MUSIC_FILES[0];

      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');

      let W, H;
      const xbars = 17;
      const ybars = 30;
      let animTime = 0;
      const speed = 30;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function draw() {
        animTime += 0.016;

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0d0d0f';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = 'rgba(100, 20, 20, 0.12)';
        ctx.lineWidth = 1;

        for (let i = 1; i <= xbars + 1; i++) {
          let yPos = (H / xbars) * (i - 1) + (animTime * speed % (H / xbars));
          ctx.beginPath();
          ctx.moveTo(0, yPos);
          ctx.lineTo(W, yPos);
          ctx.stroke();
        }

        for (let i = 1; i <= ybars + 1; i++) {
          let xPos = (W / ybars) * i - (animTime * speed % (W / ybars));
          ctx.beginPath();
          ctx.moveTo(xPos, 0);
          ctx.lineTo(xPos, H);
          ctx.stroke();
        }

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();

      const messages = document.querySelectorAll('.message');
      let currentIndex = 0;
      const totalMessages = messages.length;
      const interval = 6001;

      function nextMessage() {
        messages[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % totalMessages;
        messages[currentIndex].classList.add('active');
      }

      setInterval(nextMessage, interval);

      const emojiContainer = document.getElementById('fallingEmojis');

      const EMOJI_FILES = [
        '1.png',
        '2.png',
        '3.png',
        '4.png',
        '5.png',
        '6.png'
      ];

      const EMOJI_PATH = 'emoji/';
      const MAX_EMOJIS = 16;

      function createEmoji() {
        if (emojiContainer.children.length >= MAX_EMOJIS) return;

        const img = document.createElement('img');
        const file = EMOJI_FILES[Math.floor(Math.random() * EMOJI_FILES.length)];
        img.src = EMOJI_PATH + file;
        img.alt = '';

        img.style.left = Math.random() * 100 + 'vw';

        const duration = 8 + Math.random() * 10;
        const delay = Math.random() * 10;
        const size = 22 + Math.random() * 28;
        const blurAmount = 0.4 + Math.random() * 1.0;

        img.style.width = size + 'px';
        img.style.animationDuration = duration + 's';
        img.style.animationDelay = delay + 's';
        img.style.filter = `blur(${blurAmount}px)`;
        img.style.opacity = 0.18 + Math.random() * 0.14;

        emojiContainer.appendChild(img);

        const totalLifetime = (duration + delay) * 1000 + 800;
        setTimeout(() => {
          if (img.parentNode) img.remove();
        }, totalLifetime);
      }

      for (let i = 0; i < 7; i++) {
        createEmoji();
      }

      setInterval(createEmoji, 1200);

    })();
  </script>
</body>
</html>
